# Local development: Postgres (with pgvector) only. Django and Vite run natively.
#   docker compose -f compose.dev.yml up -d
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: relationtree
      POSTGRES_PASSWORD: relationtree
      POSTGRES_DB: relationtree
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationtree"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
