name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: relationtree
          POSTGRES_PASSWORD: relationtree
          POSTGRES_DB: relationtree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relationtree"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-insecure
      DATABASE_URL: postgres://relationtree:relationtree@localhost:5432/relationtree
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm install`, not `npm ci`: @aws-amplify/data-construct bundles its own zod, which
      # `npm ci` misreports as lockfile drift. Revisit once Amplify packages are removed (M8).
      - run: npm install
      - run: npm run lint
      - run: npm run test
      # typecheck + build import amplify_outputs.json (gitignored, generated by Amplify);
      # they return to CI in M8 once the frontend talks to the Django API instead.
