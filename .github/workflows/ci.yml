name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: relationtree
          POSTGRES_PASSWORD: relationtree
          POSTGRES_DB: relationtree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relationtree"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-insecure
      DATABASE_URL: postgres://relationtree:relationtree@127.0.0.1:5432/relationtree
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: OpenAPI schema is up to date (regenerate with the export command in README)
        run: |
          uv run python manage.py export_openapi_schema --api relationtree.api.api \
            --output ../frontend/src/api/openapi.json --indent 2
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date (npm run gen:api)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Deploys run only on main, after both check jobs pass. The server pulls the image on its next
  # start.ps1; Pages goes live immediately, so API changes must stay backward-compatible.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/relationtree-api:latest
            ghcr.io/${{ github.repository_owner }}/relationtree-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.146.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Create the Pages project on first deploy
        run: |
          $WRANGLER pages project list | grep -qw relationtree \
            || $WRANGLER pages project create relationtree --production-branch=main
      - run: $WRANGLER pages deploy dist --project-name=relationtree --branch=main
