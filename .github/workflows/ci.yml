name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: relationtree
          POSTGRES_PASSWORD: relationtree
          POSTGRES_DB: relationtree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relationtree"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-insecure
      DATABASE_URL: postgres://relationtree:relationtree@localhost:5432/relationtree
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: OpenAPI schema is up to date (regenerate with the export command in README)
        run: |
          uv run python manage.py export_openapi_schema --api relationtree.api.api \
            --output ../frontend/src/api/openapi.json --indent 2
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date (npm run gen:api)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
